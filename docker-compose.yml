services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tala
      POSTGRES_USER: tala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tala -d tala"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn tala.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"]
    environment: &backend-environment
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      DATABASE_URL: postgresql://tala:${POSTGRES_PASSWORD}@database:5432/tala
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-llama_cpp}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LLM_API_KEY: ${LLM_API_KEY:-local-development}
      LLM_MODEL: ${LLM_MODEL:-llama-local}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      WHISPER_ENABLED: ${WHISPER_ENABLED:-false}
      WHISPER_CLI_PATH: ${WHISPER_CLI_PATH:-/usr/local/bin/whisper-cli}
      WHISPER_MODEL_PATH: ${WHISPER_MODEL_PATH:-/opt/whisper/models/ggml-base.bin}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-auto}
      WHISPER_TIMEOUT_SECONDS: ${WHISPER_TIMEOUT_SECONDS:-1800}
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-TALA-AI <noreply@localhost>}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - ${WHISPER_MODEL_HOST_PATH}:/opt/whisper/models/ggml-base.bin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10

  worker:
    build: ./backend
    command: ["celery", "-A", "tala", "worker", "--loglevel=INFO"]
    environment: *backend-environment
    volumes:
      - media_data:/app/media
      - ${WHISPER_MODEL_HOST_PATH}:/opt/whisper/models/ggml-base.bin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: ["celery", "-A", "tala", "beat", "--loglevel=INFO"]
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
